name: TOEIC Trainer CI

on:
  push:
    branches: [ main, 'role-*', 'feat/**', 'ci/**', 'test/**', 'docs/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests (JUnit + Mockito)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.11 & FFmpeg tools for Video/OCR unit tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python media dependencies
        run: pip install --no-cache-dir imageio-ffmpeg yt-dlp youtube-transcript-api pillow

      - name: Verify project config & run Service Unit Tests
        working-directory: backend
        run: |
          test -f pom.xml
          chmod +x mvnw
          ./mvnw -B "-Dtest=*ServiceTest,*PipelineTest,*FlowTest,*ChatTest,Sprint6CoreServicesTest,VideoLearningEngineTest" test

  frontend-quality:
    name: Frontend TypeScript & ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & run typecheck
        working-directory: frontend
        run: |
          test -f package.json
          npm ci
          npx tsc --noEmit
          npx eslint src/components/user/QuestionMediaBlock.tsx src/pages/user/MistakeBankScreen.tsx src/pages/user/ArenaScreen.tsx src/pages/user/NotebookScreen.tsx src/pages/user/LessonScreen.tsx src/pages/user/ExamScreen.tsx src/pages/user/AttemptReviewScreen.tsx src/pages/user/PracticeAttemptReviewScreen.tsx src/pages/user/TestHubScreen.tsx src/pages/user/CardsScreen.tsx src/pages/user/ProfileScreen.tsx
