spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/toeic}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true

  servlet:
    multipart:
      enabled: true
      # Increased limits to support large video & document uploads (set to 1GB)
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2KB

jwt:
  secret: ${JWT_SECRET:3b3529bc2a79f9035075bd915c1e9cf227d2c41043cf617ba6e66c816777b5ad}
  expiration-ms: 86400000

server:
  port: ${PORT:${SERVER_PORT:8082}}
  address: 0.0.0.0
  servlet:
    context-path: /api
  # If you still hit limits from the container (embedded Tomcat/Jetty/Undertow),
  # configure the container-specific max post size separately. Spring's
  # spring.servlet.multipart.* settings above are the main ones to increase.

logging:
  level:
    root: INFO
    org.example.backendai: DEBUG

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  upload-folder: toeic-trainer/videos

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
  model: ${OPENAI_MODEL:gpt-4o-mini}

speechify:
  api-key: ${SPEECHIFY_API_KEY:}
  base-url: ${SPEECHIFY_BASE_URL:https://api.speechify.ai/v1}
  model: ${SPEECHIFY_MODEL:}
  default-voice-us: ${SPEECHIFY_VOICE_US:}
  default-voice-uk: ${SPEECHIFY_VOICE_UK:}

toeic:
  storage-dir: ${TOEIC_STORAGE_DIR:./data}
  python-bin: ${TOEIC_PYTHON_BIN:python}
  ytdlp-bin: ${TOEIC_YTDLP_BIN:yt-dlp}
  ytdlp-cookies: ${TOEIC_YTDLP_COOKIES:}
  ytdlp-proxy: ${TOEIC_YTDLP_PROXY:}
  ffmpeg-bin: ${TOEIC_FFMPEG_BIN:}
  whisper-model: ${TOEIC_WHISPER_MODEL:tiny.en}
  video-chunk-seconds: ${TOEIC_VIDEO_CHUNK_SECONDS:480}
