services:
  mysql:
    image: mysql:8.0
    container_name: toeic-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeic}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toeic-backend
    restart: unless-stopped
    env_file:
      - /opt/toeic/.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,https://toeic.daovuanh2207.workers.dev,https://toeic-trainer-api.koreacentral.cloudapp.azure.com}
      TOEIC_STORAGE_DIR: /app/data
      TOEIC_PYTHON_BIN: /opt/venv/bin/python3
      TOEIC_YTDLP_BIN: /opt/venv/bin/yt-dlp
      TOEIC_FFMPEG_BIN: /usr/bin/ffmpeg
    volumes:
      - /opt/toeic/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: toeic-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/toeic/web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
